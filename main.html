<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarixiy Sivilizatsiyalar Portali</title>
    <style>
        :root {
            --gold: #e1b12c;
            --sand: #f5e6ab;
            --dark: #0a0a0a;
            --accent: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--dark);
            color: var(--sand);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }

        /* Dasturchi Header */
        .dev-header {
            background: #000;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
        }

        .dev-btn {
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728);
            border: none; padding: 10px 25px; font-weight: bold;
            border-radius: 25px; cursor: pointer; transition: 0.3s;
        }

        /* Navigatsiya */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(0,0,0,0.9);
            padding: 10px; border-bottom: 1px solid #333;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
        }

        nav button {
            background: transparent; border: 1px solid var(--gold);
            color: var(--gold); padding: 6px 12px; cursor: pointer; font-size: 0.8rem;
        }

        nav button:hover, nav button.active { background: var(--gold); color: #000; }

        /* Mavzular */
        .page { display: none; padding: 40px 20px; animation: fadeIn 0.5s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .container { max-width: 900px; margin: 0 auto; }

        .wiki-link {
            display: block; background: var(--accent);
            padding: 25px; border-radius: 15px; border-left: 6px solid var(--gold);
            text-decoration: none; color: inherit; margin-bottom: 40px;
            transition: 0.3s;
        }

        .wiki-link:hover { transform: translateX(10px); background: #222; }

        /* MUALLIFLAR IYERARXIYASI (Har mavzu pastida) */
        .authors-section {
            margin-top: 50px;
            padding: 20px;
            background: rgba(225, 177, 44, 0.05);
            border-top: 1px solid #333;
            text-align: center;
        }

        .boss-row { margin-bottom: 15px; }
        .boss-card {
            display: inline-block;
            padding: 10px 40px;
            border: 2px solid var(--gold);
            background: rgba(225, 177, 44, 0.1);
            font-weight: bold;
            box-shadow: 0 0 15px rgba(225, 177, 44, 0.2);
        }

        .team-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .team-card {
            padding: 8px 20px;
            border: 1px solid #555;
            background: #111;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center;
        }

        .modal-box {
            background: #1a1a1a; padding: 30px; border-radius: 20px; text-align: center;
            border: 2px solid var(--gold); position: relative;
        }

        .dev-img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid var(--gold); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="dev-header">
        <button class="dev-btn" onclick="openModal()">Loyiha Boshchisi</button>
    </div>

    <nav id="navbar"></nav>

    <div id="content"></div>

    <div id="devModal" class="modal">
        <div class="modal-box">
            <span onclick="closeModal()" style="position:absolute; top:10px; right:20px; cursor:pointer; font-size:2rem;">&times;</span>
            <img src="https://via.placeholder.com/150" alt="Hasan Siddiqov" class="dev-img"> <h3>Xasan Siddiqov</h3>
            <p>Ustoz</p>
            <a href="https://t.me/khasansiddikov" target="_blank" style="color:var(--gold); text-decoration:none; font-weight:bold;">@khasansiddikov</a>
        </div>
    </div>

    <script>
        const topics = [
            { id: 'egypt', name: 'Qadimgi Misr', link: 'https://uz.wikipedia.org/wiki/Qadimgi_Misr', desc: 'Nil sohilidagi ehromlar va fir\'avnlar tarixi.' },
            { id: 'rome', name: 'Rim Imperiyasi', link: 'https://uz.wikipedia.org/wiki/Qadimgi_Rim', desc: 'Dunyo qonunchiligi va harbiy san\'at beshigi.' },
            { id: 'greece', name: 'Qadimgi Yunoniston', link: 'https://uz.wikipedia.org/wiki/Qadimgi_Yunoniston', desc: 'Falsafa, olimpiada va demokratiya vatani.' },
            { id: 'temur', name: 'Temuriylar', link: 'https://uz.wikipedia.org/wiki/Amir_Temur', desc: 'Sohibqiron Amir Temur va uning buyuk saltanati.' },
            { id: 'babylon', name: 'Vavilon', link: 'https://uz.wikipedia.org/wiki/Bobil', desc: 'Osma bog\'lar va qadimiy qonunlar shahri.' },
            { id: 'china', name: 'Qadimgi Xitoy', link: 'https://uz.wikipedia.org/wiki/Qadimgi_Xitoy', desc: 'Buyuk Xitoy devori va choy madaniyati.' },
            { id: 'maya', name: 'Maya Sivilizatsiyasi', link: 'https://uz.wikipedia.org/wiki/Maya_sivilizatsiyasi', desc: 'Astronomiya va sirli taqvimlar egalari.' },
            { id: 'persia', name: 'Fors Imperiyasi', link: 'https://uz.wikipedia.org/wiki/Axamaniylar_davlati', desc: 'Doro va Kir kabi buyuk shohlar yurti.' },
            { id: 'india', name: 'Qadimgi Hindiston', link: 'https://uz.wikipedia.org/wiki/Qadimgi_Hindiston', desc: 'Mohenjo-Daro va qadimiy vedalar tarixi.' },
            { id: 'ottoman', name: 'Usmonli Imperiyasi', link: 'https://uz.wikipedia.org/wiki/Usmonli_imperiyasi', desc: 'Uch qit\'ani birlashtirgan buyuk xalifalik.' }
        ];

        const nav = document.getElementById('navbar');
        const content = document.getElementById('content');

        topics.forEach((t, index) => {
            // Button yaratish
            const btn = document.createElement('button');
            btn.innerText = t.name;
            btn.onclick = () => showPage(t.id);
            btn.id = 'btn-' + t.id;
            if(index === 0) btn.className = 'active';
            nav.appendChild(btn);

            // Sahifa yaratish
            const section = document.createElement('div');
            section.id = t.id;
            section.className = 'page' + (index === 0 ? ' active' : '');
            section.innerHTML = `
                <div class="container">
                    <h1 style="color:var(--gold); text-align:center; margin-bottom:30px;">${t.name.toUpperCase()}</h1>
                    <a href="${t.link}" target="_blank" class="wiki-link">
                        <h3>Mavzu: ${t.name} haqida batafsil</h3>
                        <p>${t.desc}</p>
                        <small style="color:var(--gold); margin-top:10px; display:block;">Wikipedia sahifasiga o'tish ➔</small>
                    </a>
                    
                    <div class="authors-section">
                        <p style="font-size:0.7rem; color:#888; margin-bottom:10px; text-transform:uppercase;">Ushbu mavzu mualliflari:</p>
                        <div class="boss-row">
                            <div class="boss-card">M. Mirdjalilov</div>
                        </div>
                        <div class="team-row">
                            <div class="team-card">B. Muhammadshokirov</div>
                            <div class="team-card">R. Islom</div>
                            <div class="team-card">T. Mushtariy</div>
                        </div>
                    </div>
                </div>
            `;
            content.appendChild(section);
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            window.scrollTo(0,0);
        }

        function openModal() { document.getElementById('devModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('devModal').style.display = 'none'; }
    </script>
</body>
</html>
